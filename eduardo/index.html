<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Brew Haven - Inicio</title>

</head>
<body>
  <header>
    <h1>☕ Brew Haven</h1>
    <nav>
      <a href="index.html">Inicio</a>

    <div class="card">
